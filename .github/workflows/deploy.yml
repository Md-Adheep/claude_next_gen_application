name: 🚀 Deploy to Plesk — NextGen LMS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Plesk Server
    runs-on: ubuntu-latest

    steps:
      - name: 📋 Deployment info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🚀 NextGen LMS — Auto Deploy"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Pusher  : ${{ github.actor }}"
          echo "  Message : ${{ github.event.head_commit.message }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: 🔗 Trigger Plesk deployment
        timeout-minutes: 2
        run: |
          HTTP_STATUS=$(curl -s -k -o /tmp/deploy_response.txt -w "%{http_code}" \
            --max-time 60 \
            --connect-timeout 30 \
            -X POST "https://nextgen.codesen.com/deploy.php" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "pusher": "${{ github.actor }}"
            }')

          echo "📡 HTTP Status : $HTTP_STATUS"
          echo "📄 Response    :"
          cat /tmp/deploy_response.txt

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Deployment failed! HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "✅ Plesk pulled latest code!"

      - name: ✅ Deployment complete
        if: success()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ Deployment Successful!"
          echo "  🌐 Live at: https://nextgen.codesen.com"
          echo "  📝 Commit : ${{ github.sha }}"
          echo "  👤 By     : ${{ github.actor }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: ❌ Deploy failed
        if: failure()
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ❌ Deployment FAILED!"
          echo "  Check response above for details"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
