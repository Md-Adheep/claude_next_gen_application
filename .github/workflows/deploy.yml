name: 🚀 Deploy to Plesk — NextGen LMS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Plesk via FTPS/lftp
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Show deploy info ──────────────────────────────
      - name: 📋 Deployment info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🚀 NextGen LMS — FTPS Deploy"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Pusher  : ${{ github.actor }}"
          echo "  Message : ${{ github.event.head_commit.message }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ── Step 2: Checkout code ─────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── Step 3: Install lftp ──────────────────────────────────
      - name: 🔧 Install lftp
        run: sudo apt-get install -y lftp

      # ── Step 4: Deploy via FTPS ───────────────────────────────
      - name: 📤 Upload files to Plesk via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
            set ftp:ssl-allow yes;
            set ftp:ssl-force yes;
            set ssl:verify-certificate no;
            set ftp:passive-mode yes;
            open -u '$FTP_USER','$FTP_PASS' ftps://$FTP_SERVER;
            mirror --reverse --delete --verbose ./httpdocs/ /httpdocs/;
            quit
          "

      # ── Step 5: Success summary ───────────────────────────────
      - name: ✅ Deployment complete
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ FTPS Deployment Successful!"
          echo "  🌐 Live at: https://www.nextgen.codesen.com"
          echo "  📝 Commit : ${{ github.sha }}"
          echo "  👤 By     : ${{ github.actor }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
