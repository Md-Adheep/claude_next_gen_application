name: 🚀 Deploy to Plesk — NextGen LMS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Plesk via FTP
    runs-on: ubuntu-latest

    steps:
      # ── Step 1: Show deploy info ──────────────────────────────
      - name: 📋 Deployment info
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  🚀 NextGen LMS — FTP Deploy"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Pusher  : ${{ github.actor }}"
          echo "  Message : ${{ github.event.head_commit.message }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # ── Step 2: Checkout code ─────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # ── Step 3: Deploy via FTP ────────────────────────────────
      - name: 📤 Upload files to Plesk via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./httpdocs/
          server-dir: /httpdocs/
          dangerous-clean-slate: false

      # ── Step 4: Success summary ───────────────────────────────
      - name: ✅ Deployment complete
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ FTP Deployment Successful!"
          echo "  🌐 Live at: https://www.nextgen.codesen.com"
          echo "  📝 Commit : ${{ github.sha }}"
          echo "  👤 By     : ${{ github.actor }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
